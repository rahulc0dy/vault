<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <meta name="color-scheme" content="only dark">

  <!-- SEO — Replace {{PLACEHOLDERS}} with your story details -->
  <title>{{TITLE}} — Vault</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="author" content="Rahul Chakraborty">
  <link rel="canonical" href="https://rahulc0dy.is-a.dev/stories/{{SLUG}}/">
  <link rel="icon" type="image/png" href="/assets/icons/alien-icon.png">

  <!-- Open Graph — For rich previews on Facebook, Discord, LinkedIn, etc. -->
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{TITLE}} — Vault">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:image" content="https://rahulc0dy.is-a.dev/stories/{{SLUG}}/og-image.png">
  <meta property="og:url" content="https://rahulc0dy.is-a.dev/stories/{{SLUG}}/">
  <meta property="og:site_name" content="Vault">
  <meta property="article:published_time" content="{{YYYY-MM-DD}}">
  <meta property="article:author" content="Rahul Chakraborty">

  <!-- Twitter Card — For rich previews on Twitter/X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{TITLE}} — Vault">
  <meta name="twitter:description" content="{{DESCRIPTION}}">
  <meta name="twitter:image" content="https://rahulc0dy.is-a.dev/stories/{{SLUG}}/og-image.png">

  <!-- Styles & Scripts -->
  <link href="../../common.css" rel="stylesheet">
  <link href="../story-styles.css" rel="stylesheet">
  <script defer src="../../common.js"></script>
</head>
<body>
<site-navbar></site-navbar>
<header class="blog-header">
  <h1>{{TITLE}}</h1>
  <p>
    <span class="blog-date">{{DD Month YYYY}}</span> . <span class="read-time">{{X}}min read</span>
  </p>
  <div class="tags">
    <span title="html"></span>
    <span title="css"></span>
    <span title="js"></span>
  </div>
</header>
<article class="blog-content">
  <h5>Header</h5>
  <p>
    Your content here.
  </p>
</article>
<site-footer></site-footer>

  CHECKLIST FOR NEW STORIES:

  5. Add the story URL to sitemap.xml
-->
</body>
</html>
